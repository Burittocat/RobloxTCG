# VS Code 에서 저장하면 이 설정으로 자동 정렬된다.
#
# 폭이 110 이 아니라 140 인 이유: stylua 는 줄 길이를 **바이트로 센다.** 한글은 글자당
# 3바이트라, 화면에서 짧은 줄도 길다고 보고 쪼갠다 — 한글 문자열이 여기저기 잘려나갔다.
# 140 은 저장소 전체에서 stylua 와 손으로 맞춘 서식이 가장 적게 부딪히는 값이다
# (측정: 110 → 32개 파일, 140 → 19개, 200 → 24개).
#
# 그래도 0 은 아니다. 이 저장소는 한글 표시 폭 기준으로 손으로 맞춰 왔고 stylua 는
# 그걸 모델링하지 못한다. 남은 차이는 stylua 가 여러 줄 조건문을 한 줄로 합치려는 쪽이다.
column_width = 140
line_endings = "Unix"
indent_type = "Tabs"
indent_width = 4
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
